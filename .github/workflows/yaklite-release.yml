name: yaklite release

# Builds yaklite for macOS (one universal binary for Apple Silicon and Intel)
# and Linux, smoke-tests each build, and publishes them on the rolling
# "yaklite-latest" release so they can be downloaded with one command.
#
# The macOS build is signed with a Developer ID and notarized by Apple when
# these repository secrets exist (Settings > Secrets and variables > Actions);
# without them it is ad-hoc signed as before:
#   APPLE_CERT_P12       the "Developer ID Application" certificate and key,
#                        exported from Keychain Access as .p12, base64 encoded
#   APPLE_CERT_PASSWORD  the password chosen when exporting the .p12
#   APPLE_ID             the Apple ID email of the developer account
#   APPLE_TEAM_ID        the 10 character team ID (developer.apple.com > Membership)
#   APPLE_APP_PASSWORD   an app-specific password for that Apple ID (appleid.apple.com)
on:
  push:
    branches: [main, "claude/**"]
    paths: ["cmd/yaklite/**", ".github/workflows/yaklite-release.yml"]
    tags: ["yaklite-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaklite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: yaklite-macos
          - os: ubuntu-22.04
            asset: yaklite-linux-amd64
          - os: ubuntu-24.04-arm
            asset: yaklite-linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./cmd/yaklite

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
        run: |
          GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o yaklite-arm64 ./cmd/yaklite
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o yaklite-amd64 ./cmd/yaklite
          lipo -create -output ${{ matrix.asset }} yaklite-arm64 yaklite-amd64
          codesign --force --sign - ${{ matrix.asset }}
          lipo -info ${{ matrix.asset }}

      - name: Sign and notarize (macOS, when the Apple secrets are set)
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          test -n "$ID" || { echo "no Developer ID Application certificate in APPLE_CERT_P12"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$ID" ${{ matrix.asset }}
          codesign --verify --strict --verbose=2 ${{ matrix.asset }}
          ditto -c -k --keepParent ${{ matrix.asset }} notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          rm -f notarize.zip
          security delete-keychain "$KC"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o ${{ matrix.asset }} ./cmd/yaklite

      - name: Smoke test
        run: |
          ./${{ matrix.asset }} --help
          python3 -m http.server 18080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          ./${{ matrix.asset }} scan -t 127.0.0.1 -p 18080 --no-arp | tee scan.txt
          grep -q "tcp/18080" scan.txt
          ./${{ matrix.asset }} status || true
          ls -la ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --title "$TAG" --notes "yaklite $TAG" || gh release upload "$TAG" dist/* --clobber
          else
            TAG=yaklite-latest
            NOTES="Latest yaklite build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Unsigned: install with curl as shown in cmd/yaklite/README.md."
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "yaklite (latest build)" --notes "$NOTES"
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" dist/* --clobber
          fi
