name: yaklite release

# Builds yaklite for macOS (one universal binary for Apple Silicon and Intel)
# and Linux, smoke-tests each build, and publishes them on the rolling
# "yaklite-latest" release so they can be downloaded with one command.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["cmd/yaklite/**", ".github/workflows/yaklite-release.yml"]
    tags: ["yaklite-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaklite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: yaklite-macos
          - os: ubuntu-22.04
            asset: yaklite-linux-amd64
          - os: ubuntu-24.04-arm
            asset: yaklite-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./cmd/yaklite

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
        run: |
          GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o yaklite-arm64 ./cmd/yaklite
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" -o yaklite-amd64 ./cmd/yaklite
          lipo -create -output ${{ matrix.asset }} yaklite-arm64 yaklite-amd64
          codesign --force --sign - ${{ matrix.asset }}
          lipo -info ${{ matrix.asset }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w" -o ${{ matrix.asset }} ./cmd/yaklite

      - name: Smoke test
        run: |
          ./${{ matrix.asset }} --help
          python3 -m http.server 18080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          ./${{ matrix.asset }} scan -t 127.0.0.1 -p 18080 --no-arp | tee scan.txt
          grep -q "tcp/18080" scan.txt
          ./${{ matrix.asset }} status || true
          ls -la ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --title "$TAG" --notes "yaklite $TAG" || gh release upload "$TAG" dist/* --clobber
          else
            TAG=yaklite-latest
            NOTES="Latest yaklite build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Unsigned: install with curl as shown in cmd/yaklite/README.md."
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "yaklite (latest build)" --notes "$NOTES"
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" dist/* --clobber
          fi
